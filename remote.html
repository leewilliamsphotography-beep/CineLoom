<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CineLoom Remote</title>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
  body { margin: 0; padding: 0; background: linear-gradient(145deg, #08090b, #0e1015); color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
  .entry-container { background: linear-gradient(145deg, #15171c, #0d0f13); border-radius: 36px; padding: 2.5rem 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.6); width: 100%; max-width: 360px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; gap: 1.5rem; text-align: center; }
  .entry-brand { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.05em; color: #fff; }
  .entry-subtitle { font-size: 0.9rem; color: #a0a4a8; margin-top: -1rem; }
  .code-input { background: #050607; border: 1px solid #1a1a1a; border-radius: 12px; padding: 1rem; text-align: center; font-size: 2rem; font-weight: 700; font-family: 'Courier New', monospace; color: #3b82f6; text-shadow: 0 0 15px rgba(59, 130, 246, 0.3); width: 100%; letter-spacing: 0.2em; outline: none; transition: border 0.2s; }
  .code-input:focus { border-color: #3b82f6; }
  .connect-btn { background: #3b82f6; color: #fff; border: none; padding: 0.9rem; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; border-radius: 12px; width: 100%; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); transition: all 0.2s; }
  .connect-btn:active { transform: scale(0.96); }
  .status-pill { font-size: 0.7rem; font-weight: 600; color: #62666d; background: rgba(255,255,255,0.05); padding: 0.3rem 0.8rem; border-radius: 999px; display: inline-block; margin-top: 0.5rem; border: 1px solid rgba(255,255,255,0.1); }

  .remote-app { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; width: 100%; }
  .remote-device { background: linear-gradient(145deg, #15171c, #0d0f13); border-radius: 36px; padding: 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.6); width: 100%; max-width: 360px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 1rem; position: relative; }
  .remote-brand { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.05em; color: #fff; text-align: center; }
  
  .remote-lcd { background: #050607; border: 1px solid #1a1a1a; border-radius: 12px; padding: 1rem; text-align: center; box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); }
  .remote-lcd-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.15em; color: #4a4a4a; margin-bottom: 0.25rem; font-weight: 700; }
  .remote-lcd-time { font-size: 1.6rem; font-weight: 700; font-family: 'Courier New', monospace; color: #3b82f6; text-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
  .lcd-status-row { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; font-size: 0.7rem; color: #a0a4a8; }
  .lcd-volume-wrap { display: flex; align-items: center; gap: 0.3rem; }
  .lcd-volume-bar { width: 60px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  .lcd-volume-fill { height: 100%; background: #3b82f6; width: 80%; transition: width 0.2s, background 0.2s; }
  
  .remote-controls { display: flex; flex-direction: column; gap: 0.5rem; }
  .remote-row { display: flex; gap: 0.5rem; justify-content: center; }
  .remote-btn-action { background: #1a1d24; border: 1px solid rgba(255,255,255,0.06); color: #a0a4a8; padding: 0.7rem; font-family: inherit; font-size: 0.7rem; font-weight: 600; cursor: pointer; border-radius: 12px; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 0.3rem; flex: 1; min-height: 48px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); user-select: none; }
  .remote-btn-action:active { transform: scale(0.95); background: #232730; color: #fff; }
  .remote-btn-action svg { width: 16px; height: 16px; pointer-events: none; }
  .remote-btn-primary { background: #3b82f6; color: #fff; border-color: transparent; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
  .remote-btn-primary:active { background: #2563eb; }
  .remote-btn-center { width: 60px; height: 60px; border-radius: 50%; flex: 0 0 auto; padding: 0; font-size: 0; }
  .remote-btn-center svg { width: 24px; height: 24px; }
  .remote-divider { width: 100%; height: 1px; background: rgba(255,255,255,0.05); margin: 0.2rem 0; }

  /* Disconnect Overlay */
  .disconnect-overlay { position: absolute; inset: 0; background: rgba(8,9,11,0.95); backdrop-filter: blur(4px); border-radius: 36px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; z-index: 10; }
  .disconnect-overlay.show { display: flex; }
  .disconnect-text { font-size: 1.1rem; color: #ef4444; font-weight: 700; }
  .reconnect-btn { background: #3b82f6; color: #fff; border: none; padding: 0.8rem 1.5rem; font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; border-radius: 12px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
</style>
</head>
<body>

<!-- Code Entry Screen -->
<div class="entry-container" id="entryScreen">
  <div class="entry-brand">CineLoom Remote</div>
  <div class="entry-subtitle">Enter the 6-digit code shown on your TV</div>
  <input type="text" inputmode="numeric" maxlength="6" class="code-input" id="codeInput" placeholder="123456">
  <button class="connect-btn" id="connectBtn">Connect</button>
  <div class="status-pill" id="entryStatus">Waiting for code...</div>
</div>

<!-- Remote App UI -->
<div class="remote-app" id="remoteApp">
  <div class="remote-device">
    <div class="remote-brand">CineLoom Remote</div>
    
    <div class="remote-lcd">
      <div class="remote-lcd-label">Time Remaining</div>
      <div class="remote-lcd-time" id="timeRemainingDisplay">--:--:--</div>
      <div class="lcd-status-row">
        <span id="lcdSpeed">1x</span>
        <div class="lcd-volume-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <div class="lcd-volume-bar"><div class="lcd-volume-fill" id="lcdVolumeFill"></div></div>
        </div>
      </div>
    </div>

    <div class="remote-controls">
      <div class="remote-row">
        <button class="remote-btn-action" id="rPlay1"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Film 1</button>
        <button class="remote-btn-action" id="rPlay2"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Film 2</button>
        <button class="remote-btn-action" id="rSwapFilms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3l4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></svg> Swap</button>
      </div>
      <div class="remote-row">
        <button class="remote-btn-action" id="rSeekBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 20L9 12l10-8v16z"/><line x1="5" y1="19" x2="5" y2="5"/></svg> -10s</button>
        <button class="remote-btn-action remote-btn-primary remote-btn-center" id="rPlayPause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
        <button class="remote-btn-action" id="rSeekFwd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4l10 8-10 8V4z"/><line x1="19" y1="5" x2="19" y2="19"/></svg> +10s</button>
      </div>
      <div class="remote-row">
        <button class="remote-btn-action" id="rSkip90">Skip 90s</button>
        <button class="remote-btn-action" id="rSpeed">Speed</button>
        <button class="remote-btn-action" id="rLights">Lights</button>
      </div>
      <div class="remote-divider"></div>
      <div class="remote-row">
        <button class="remote-btn-action" id="rSubBack">Sub -0.5s</button>
        <button class="remote-btn-action" id="rSubs">Subs</button>
        <button class="remote-btn-action" id="rSubFwd">Sub +0.5s</button>
      </div>
      <div class="remote-row">
        <button class="remote-btn-action" id="rVolDown">Vol -</button>
        <button class="remote-btn-action" id="rMute">Mute</button>
        <button class="remote-btn-action" id="rVolUp">Vol +</button>
      </div>
      <div class="remote-divider"></div>
      <div class="remote-row">
        <button class="remote-btn-action" id="rFullscreen">Web Full</button>
        <button class="remote-btn-action" id="rShowtime">Showtime</button>
      </div>
    </div>

    <div class="disconnect-overlay" id="disconnectOverlay">
      <div class="disconnect-text">Host Disconnected</div>
      <button class="reconnect-btn" id="reconnectBtn">Reconnect</button>
    </div>
  </div>
</div>

<script>
console.log("CineLoom Remote v1.3.0 loaded");

const urlParams = new URLSearchParams(window.location.search);
let roomCode = urlParams.get('room');
const entryScreen = document.getElementById('entryScreen');
const remoteApp = document.getElementById('remoteApp');
const codeInput = document.getElementById('codeInput');
const connectBtn = document.getElementById('connectBtn');
const entryStatus = document.getElementById('entryStatus');
const disconnectOverlay = document.getElementById('disconnectOverlay');
let client = null;
let cmdTopic = '';

function sendCmd(action, e) {
    if (client && client.connected) {
      client.publish(cmdTopic, JSON.stringify({action: action}), { qos: 1 });
      if (e && e.currentTarget) {
        e.currentTarget.style.boxShadow = '0 0 15px #3b82f6';
        setTimeout(() => { e.currentTarget.style.boxShadow = ''; }, 300);
      }
    }
}

document.getElementById('rPlay1').addEventListener('click', (e) => sendCmd('play1', e));
document.getElementById('rPlay2').addEventListener('click', (e) => sendCmd('play2', e));
document.getElementById('rSwapFilms').addEventListener('click', (e) => sendCmd('swapFilms', e));
document.getElementById('rPlayPause').addEventListener('click', (e) => sendCmd('playPause', e));
document.getElementById('rFullscreen').addEventListener('click', (e) => sendCmd('fullscreen', e));
document.getElementById('rSeekBack').addEventListener('click', (e) => sendCmd('seekBack', e));
document.getElementById('rSeekFwd').addEventListener('click', (e) => sendCmd('seekFwd', e));
document.getElementById('rShowtime').addEventListener('click', (e) => sendCmd('showtime', e));
document.getElementById('rVolUp').addEventListener('click', (e) => sendCmd('volumeUp', e));
document.getElementById('rVolDown').addEventListener('click', (e) => sendCmd('volumeDown', e));
document.getElementById('rMute').addEventListener('click', (e) => sendCmd('mute', e));
document.getElementById('rSubs').addEventListener('click', (e) => sendCmd('toggleSubs', e));
document.getElementById('rSubBack').addEventListener('click', (e) => sendCmd('subSyncBack', e));
document.getElementById('rSubFwd').addEventListener('click', (e) => sendCmd('subSyncFwd', e));
document.getElementById('rLights').addEventListener('click', (e) => sendCmd('lights', e));
document.getElementById('rSpeed').addEventListener('click', (e) => sendCmd('speed', e));
document.getElementById('rSkip90').addEventListener('click', (e) => sendCmd('skip90', e));

document.getElementById('reconnectBtn').addEventListener('click', () => {
    disconnectOverlay.classList.remove('show');
    lastUpdateTime = Date.now(); // Reset timer
    client.publish(cmdTopic, JSON.stringify({action: 'hello'}), { qos: 1 });
});

function connectToBroker(statusEl, onConnect) {
    const brokers = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
    let brokerIndex = 0; let connected = false;
    function tryNext() {
        if (brokerIndex >= brokers.length || connected) {
            if (!connected) { statusEl.textContent = "Connection Failed."; statusEl.style.color = "#ef4444"; }
            return;
        }
        const url = brokers[brokerIndex];
        statusEl.textContent = `Connecting...`;
        const clientId = 'cineloom-remote-' + Math.random().toString(16).substr(2, 8);
        const client = mqtt.connect(url, { clientId: clientId, connectTimeout: 3000, reconnectPeriod: 5000 });
        client.on('connect', () => {
            connected = true;
            statusEl.textContent = "Connected!";
            statusEl.style.color = "#41d636";
            onConnect(client);
        });
        client.on('error', (err) => { console.error('Broker error:', err); client.end(); });
        client.on('close', () => { if (!connected) { brokerIndex++; tryNext(); } });
    }
    tryNext();
}

let lastUpdateTime = Date.now();
let hostFound = false;

function connectToHost(code) {
    if (!code || code.length !== 6) {
      entryStatus.textContent = "Invalid code. Must be 6 digits.";
      entryStatus.style.color = "#ef4444";
      return;
    }
    roomCode = code;
    entryStatus.textContent = "Searching for host...";
    entryStatus.style.color = "#a0a4a8";
    
    connectToBroker(entryStatus, (c) => {
      client = c;
      cmdTopic = `cineloom/${roomCode}/cmd`;
      const timeTopic = `cineloom/${roomCode}/time`;
      
      const hostTimeout = setTimeout(() => {
        if (!hostFound) {
          entryStatus.textContent = "No active host found. Check code and try again.";
          entryStatus.style.color = "#ef4444";
          if (client) client.end();
        }
      }, 5000);

      const disconnectInterval = setInterval(() => {
        if (hostFound && Date.now() - lastUpdateTime > 5000) {
          disconnectOverlay.classList.add('show');
        }
      }, 2000);
      
      client.on('message', (topic, message) => {
        if (topic === timeTopic) {
          if (!hostFound) {
            hostFound = true;
            clearTimeout(hostTimeout);
            entryScreen.style.display = 'none';
            remoteApp.style.display = 'flex';
          }
          lastUpdateTime = Date.now();
          disconnectOverlay.classList.remove('show');
          
          const data = JSON.parse(message.toString());
          document.getElementById('timeRemainingDisplay').textContent = data.timeStr;
          document.getElementById('lcdSpeed').textContent = `${data.speed}x`;
          
          const fill = document.getElementById('lcdVolumeFill');
          if (data.muted) {
            fill.style.width = '0%';
            fill.style.background = '#ef4444';
          } else {
            fill.style.width = `${data.volume * 100}%`;
            fill.style.background = '#3b82f6';
          }
        }
      });
      
      client.subscribe(timeTopic);
      client.publish(cmdTopic, JSON.stringify({action: 'hello'}), { qos: 1 });
    });
}

if (roomCode && roomCode.length === 6) {
    connectToHost(roomCode);
} else {
    connectBtn.addEventListener('click', () => connectToHost(codeInput.value.trim()));
    codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectToHost(codeInput.value.trim()); });
}
</script>
</body>
</html>
