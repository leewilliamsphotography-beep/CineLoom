<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CineLoom Remote</title>
<style>
  :root {
    --bg: #000000;
    --bg-card: rgba(28, 28, 30, 0.8);
    --bg-btn: rgba(44, 44, 46, 0.9);
    --bg-btn-active: rgba(58, 58, 60, 1);
    --text: #ffffff;
    --text-dim: #8e8e93;
    --accent: #0a84ff;
    --accent-glow: rgba(10, 132, 255, 0.4);
    --danger: #ff453a;
    --success: #30d158;
    --border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    min-height: 100vh; 
    overflow: hidden; 
    user-select: none;
  }

  /* Entry Screen */
  .entry-container { 
    width: 100%; max-width: 360px; 
    background: var(--bg-card); 
    backdrop-filter: blur(20px); 
    border: 1px solid var(--border); 
    border-radius: 24px; 
    padding: 2.5rem 2rem; 
    display: flex; flex-direction: column; align-items: center; gap: 1.5rem; 
    text-align: center; 
    margin: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .entry-brand { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .entry-subtitle { font-size: 0.9rem; color: var(--text-dim); margin-top: -1rem; }
  .code-input { 
    background: rgba(0,0,0,0.5); border: 1px solid var(--border); 
    border-radius: 12px; padding: 1rem; text-align: center; 
    font-size: 2.5rem; font-weight: 600; 
    color: var(--accent); width: 100%; letter-spacing: 0.2em; 
    outline: none; transition: border 0.2s; 
  }
  .code-input:focus { border-color: var(--accent); }
  .connect-btn { 
    background: var(--accent); color: #fff; border: none; 
    padding: 1rem; font-size: 1.1rem; font-weight: 600; 
    cursor: pointer; border-radius: 12px; width: 100%; 
    transition: transform 0.1s;
  }
  .connect-btn:active { transform: scale(0.97); }
  .status-pill { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.5rem; }

  /* App Layout */
  .remote-app { 
    display: none; 
    flex-direction: column; 
    width: 100%; height: 100vh; 
    max-width: 420px; 
    padding: 1.5rem 1rem 2rem 1rem; 
    margin: 0 auto;
  }
  
  .header { display: flex; justify-content: space-between; align-items: center; padding: 0 0.5rem 1.5rem 0.5rem; }
  .header-brand { font-size: 1.2rem; font-weight: 700; }
  .header-status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--success); }
  .status-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 5px var(--success); }
  .dimmer-btn { background: var(--bg-btn); border: none; color: var(--text-dim); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .dimmer-btn svg { width: 16px; height: 16px; }

  /* Now Playing Card (Gesture Pad) */
  .now-playing { 
    background: var(--bg-card); 
    border: 1px solid var(--border); 
    border-radius: 16px; padding: 1.5rem; 
    text-align: center; margin-bottom: 1.5rem; 
    position: relative;
    touch-action: none; /* Prevent scrolling while swiping */
  }
  .np-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 0.5rem; }
  .np-time { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .np-info-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
  .np-speed { font-size: 0.9rem; font-weight: 600; color: var(--accent); background: rgba(10, 132, 255, 0.15); padding: 4px 8px; border-radius: 6px; }
  .np-vol-wrap { display: flex; align-items: center; gap: 4px; }
  .vol-bar { width: 4px; height: 16px; background: var(--bg-btn); border-radius: 2px; transition: background 0.2s; }
  .vol-bar.active { background: var(--accent); box-shadow: 0 0 3px var(--accent); }
  .vol-bar.muted { background: var(--danger) !important; box-shadow: 0 0 3px var(--danger); }
  .gesture-hint { font-size: 0.65rem; color: var(--text-dim); margin-top: 1rem; opacity: 0.6; }

  /* Controls Grid */
  .controls-grid { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .ctrl-row { display: flex; gap: 12px; }
  .ctrl-btn { 
    flex: 1; background: var(--bg-btn); border: 1px solid var(--border); 
    color: var(--text); padding: 1rem 0.5rem; 
    font-size: 0.8rem; font-weight: 600; cursor: pointer; 
    border-radius: 16px; transition: all 0.15s; 
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 60px;
  }
  .ctrl-btn:active { transform: scale(0.96); background: var(--bg-btn-active); }
  .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }
  
  /* Primary Transport Row */
  .transport-row { gap: 16px; margin: 1rem 0; }
  .transport-btn { min-height: 70px; border-radius: 20px; }
  .play-btn { 
    flex: 1.5; background: var(--accent); color: #fff; border: none; 
    box-shadow: 0 4px 15px var(--accent-glow); 
  }
  .play-btn:active { background: #0066cc; transform: scale(0.97); }
  .play-btn svg { width: 28px; height: 28px; }

  /* Disconnect Overlay */
  .disconnect-overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
    backdrop-filter: blur(20px); display: none; 
    flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; z-index: 100; 
  }
  .disconnect-overlay.show { display: flex; }
  .dc-icon { width: 60px; height: 60px; color: var(--danger); }
  .dc-text { font-size: 1.2rem; font-weight: 600; color: var(--danger); }
  .reconnect-btn { 
    background: var(--accent); color: #fff; border: none; 
    padding: 0.8rem 2rem; font-size: 1rem; font-weight: 600; 
    cursor: pointer; border-radius: 12px; 
    transition: transform 0.1s;
  }
  .reconnect-btn:active { transform: scale(0.97); }

  /* Screen Dimmer Overlay */
  .dimmer-overlay { position: fixed; inset: 0; background: #000; z-index: 99; display: none; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .dimmer-overlay.active { display: block; opacity: 0.7; }
</style>
</head>
<body>

<!-- Entry Screen -->
<div class="entry-container" id="entryScreen">
  <div class="entry-brand">CineLoom</div>
  <div class="entry-subtitle">Enter the 6-digit code</div>
  <input type="text" inputmode="numeric" maxlength="6" class="code-input" id="codeInput" placeholder="123456">
  <button class="connect-btn" id="connectBtn">Connect</button>
  <div class="status-pill" id="entryStatus">Waiting for code...</div>
</div>

<!-- App UI -->
<div class="remote-app" id="remoteApp">
  <div class="header">
    <div class="header-brand">Remote</div>
    <div class="header-status">
      <div class="status-dot"></div>
      <span id="connStatus">Connected</span>
    </div>
    <button class="dimmer-btn" id="dimmerToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <!-- Now Playing (Gesture Pad) -->
  <div class="now-playing" id="nowPlaying">
    <div class="np-label">Time Remaining</div>
    <div class="np-time" id="timeRemainingDisplay">--:--:--</div>
    <div class="np-info-row">
      <div class="np-speed" id="lcdSpeed">1x</div>
      <div class="np-vol-wrap" id="volBars">
        <div class="vol-bar"></div><div class="vol-bar"></div><div class="vol-bar"></div>
        <div class="vol-bar"></div><div class="vol-bar"></div><div class="vol-bar"></div>
        <div class="vol-bar"></div><div class="vol-bar"></div><div class="vol-bar"></div><div class="vol-bar"></div>
      </div>
    </div>
    <div class="gesture-hint">Swipe ↔ to Seek • ↕ for Volume</div>
  </div>

  <div class="controls-grid">
    <!-- Transport -->
    <div class="ctrl-row transport-row">
      <button class="ctrl-btn transport-btn" id="rSeekBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 20L9 12l10-8v16z"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        <span>-10s</span>
      </button>
      <button class="ctrl-btn transport-btn play-btn" id="rPlayPause">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn transport-btn" id="rSeekFwd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4l10 8-10 8V4z"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        <span>+10s</span>
      </button>
    </div>

    <!-- Media Actions -->
    <div class="ctrl-row">
      <button class="ctrl-btn" id="rSkip90">Skip 90s</button>
      <button class="ctrl-btn" id="rSpeed">Speed</button>
      <button class="ctrl-btn" id="rLights">Lights</button>
      <button class="ctrl-btn" id="rFullscreen">Web Full</button>
    </div>

    <!-- Content -->
    <div class="ctrl-row">
      <button class="ctrl-btn" id="rPlay1">Film 1</button>
      <button class="ctrl-btn" id="rSwapFilms">Swap</button>
      <button class="ctrl-btn" id="rPlay2">Film 2</button>
    </div>

    <!-- Subtitles -->
    <div class="ctrl-row">
      <button class="ctrl-btn" id="rSubBack">Sub -</button>
      <button class="ctrl-btn" id="rSubs">Subs</button>
      <button class="ctrl-btn" id="rSubFwd">Sub +</button>
    </div>

    <!-- Volume -->
    <div class="ctrl-row">
      <button class="ctrl-btn" id="rVolDown">Vol -</button>
      <button class="ctrl-btn" id="rMute">Mute</button>
      <button class="ctrl-btn" id="rVolUp">Vol +</button>
    </div>

    <!-- System -->
    <div class="ctrl-row">
      <button class="ctrl-btn" id="rShowtime" style="background: var(--accent); color: #fff; border: none;">Showtime</button>
    </div>
  </div>
</div>

<!-- Disconnect Overlay -->
<div class="disconnect-overlay" id="disconnectOverlay">
  <svg class="dc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07A10 10 0 0 1 19.07 4.93M4.93 4.93l14.14 14.14"/></svg>
  <div class="dc-text">Host Disconnected</div>
  <button class="reconnect-btn" id="reconnectBtn">Reconnect</button>
</div>

<!-- Screen Dimmer -->
<div class="dimmer-overlay" id="dimmerOverlay"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<script>
console.log("CineLoom Remote v2.3.0 (Firebase Custom) loaded");

// =================================================================
// YOUR FIREBASE CONFIG
// =================================================================
const firebaseConfig = {
  apiKey: "AIzaSyCWA08JzsS6o1zwyUotq1M31mnE_jdkHBI",
  authDomain: "cineloom-955c1.firebaseapp.com",
  databaseURL: "https://console.firebase.google.com/u/0/project/cineloom-955c1/database/cineloom-955c1-default-rtdb/data/~2F", // Inferred URL. Verify in Firebase Console.
  projectId: "cineloom-955c1",
  storageBucket: "cineloom-955c1.firebasestorage.app",
  messagingSenderId: "406285683934",
  appId: "1:406285683934:web:007f4b5dc7f88094b0064f",
  measurementId: "G-G3QRRN32ZB"
};
// =================================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const urlParams = new URLSearchParams(window.location.search);
let roomCode = urlParams.get('room');
const entryScreen = document.getElementById('entryScreen');
const remoteApp = document.getElementById('remoteApp');
const codeInput = document.getElementById('codeInput');
const connectBtn = document.getElementById('connectBtn');
const entryStatus = document.getElementById('entryStatus');
const disconnectOverlay = document.getElementById('disconnectOverlay');
const dimmerOverlay = document.getElementById('dimmerOverlay');
const nowPlaying = document.getElementById('nowPlaying');
let statusRef = null;
let commandRef = null;
let hostFound = false;
let lastUpdateTime = Date.now();

function vibrate(ms = 10) { if (navigator.vibrate) navigator.vibrate(ms); }

function sendCmd(action, e) {
  if (commandRef) {
    commandRef.set({ action: action, timestamp: Date.now() });
    vibrate(15);
    if (e && e.currentTarget) {
      const btn = e.currentTarget;
      const originalBg = btn.style.background;
      btn.style.background = 'rgba(10, 132, 255, 0.3)';
      setTimeout(() => { btn.style.background = originalBg; }, 200);
    }
  }
}

// Button Listeners
document.getElementById('rPlay1').addEventListener('click', (e) => sendCmd('play1', e));
document.getElementById('rPlay2').addEventListener('click', (e) => sendCmd('play2', e));
document.getElementById('rSwapFilms').addEventListener('click', (e) => sendCmd('swapFilms', e));
document.getElementById('rPlayPause').addEventListener('click', (e) => sendCmd('playPause', e));
document.getElementById('rFullscreen').addEventListener('click', (e) => sendCmd('fullscreen', e));
document.getElementById('rSeekBack').addEventListener('click', (e) => sendCmd('seekBack', e));
document.getElementById('rSeekFwd').addEventListener('click', (e) => sendCmd('seekFwd', e));
document.getElementById('rShowtime').addEventListener('click', (e) => sendCmd('showtime', e));
document.getElementById('rVolUp').addEventListener('click', (e) => sendCmd('volumeUp', e));
document.getElementById('rVolDown').addEventListener('click', (e) => sendCmd('volumeDown', e));
document.getElementById('rMute').addEventListener('click', (e) => sendCmd('mute', e));
document.getElementById('rSubs').addEventListener('click', (e) => sendCmd('toggleSubs', e));
document.getElementById('rSubBack').addEventListener('click', (e) => sendCmd('subSyncBack', e));
document.getElementById('rSubFwd').addEventListener('click', (e) => sendCmd('subSyncFwd', e));
document.getElementById('rLights').addEventListener('click', (e) => sendCmd('lights', e));
document.getElementById('rSpeed').addEventListener('click', (e) => sendCmd('speed', e));
document.getElementById('rSkip90').addEventListener('click', (e) => sendCmd('skip90', e));

document.getElementById('reconnectBtn').addEventListener('click', () => {
    disconnectOverlay.classList.remove('show');
    sendCmd('hello'); // Ping the host
});

// Screen Dimmer Logic
const dimmerToggle = document.getElementById('dimmerToggle');
let isDimmed = false;
dimmerToggle.addEventListener('click', () => {
  isDimmed = !isDimmed;
  dimmerOverlay.classList.toggle('active', isDimmed);
});

// Gesture Controls
let touchStartX = 0, touchStartY = 0;
nowPlaying.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

nowPlaying.addEventListener('touchend', (e) => {
  const diffX = e.changedTouches[0].screenX - touchStartX;
  const diffY = e.changedTouches[0].screenY - touchStartY;
  
  if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
    if (diffX > 0) sendCmd('seekFwd'); else sendCmd('seekBack');
    vibrate(20);
  } else if (Math.abs(diffY) > 40) {
    if (diffY > 0) sendCmd('volumeDown'); else sendCmd('volumeUp');
    vibrate(20);
  }
}, { passive: true });

function connectToHost(code) {
    if (!code || code.length !== 6) {
      entryStatus.textContent = "Invalid code. Must be 6 digits.";
      entryStatus.style.color = "#ff453a";
      return;
    }
    roomCode = code;
    entryStatus.textContent = "Searching for host...";
    entryStatus.style.color = "#8e8e93";
    
    statusRef = db.ref(`cineloom/${roomCode}/status`);
    commandRef = db.ref(`cineloom/${roomCode}/command`);
    
    // Listen for host status updates
    statusRef.on('value', (snapshot) => {
      const data = snapshot.val();
      
      if (!hostFound) {
        if (data) {
          hostFound = true;
          entryScreen.style.display = 'none';
          remoteApp.style.display = 'flex';
        }
      }
      
      if (data) {
        lastUpdateTime = Date.now();
        disconnectOverlay.classList.remove('show');
        
        document.getElementById('timeRemainingDisplay').textContent = data.timeStr || '--:--:--';
        document.getElementById('lcdSpeed').textContent = `${data.speed}x`;
        
        const volBars = document.querySelectorAll('.vol-bar');
        const volLevel = data.volume ? Math.round(data.volume * 10) : 0;
        volBars.forEach((bar, index) => {
          bar.classList.remove('active', 'muted');
          if (data.muted) {
            bar.classList.add('muted');
          } else if (index < volLevel) {
            bar.classList.add('active');
          }
        });
      } else if (hostFound) {
        // Host disconnected
        disconnectOverlay.classList.add('show');
      }
    });

    // Timeout if host not found in 5 seconds
    setTimeout(() => {
      if (!hostFound) {
        entryStatus.textContent = "No active host found. Check code and try again.";
        entryStatus.style.color = "#ff453a";
        if (statusRef) statusRef.off();
      }
    }, 5000);
}

if (roomCode && roomCode.length === 6) {
    connectToHost(roomCode);
} else {
    connectBtn.addEventListener('click', () => connectToHost(codeInput.value.trim()));
    codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectToHost(codeInput.value.trim()); });
}
</script>
</body>
</html>
