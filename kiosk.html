<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineLoom Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --text: #ffffff;
    --text-soft: rgba(255, 255, 255, 0.7);
    --accent: #3b82f6;
    --accent-2: #8b5cf6;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body { 
    height: 100%; width: 100%; 
    background: var(--bg); color: var(--text); 
    font-family: 'Inter', sans-serif; 
    overflow: hidden; 
    cursor: none; /* Hide cursor for true kiosk feel */
  }
  
  #kiosk-container {
    position: fixed; inset: 0; 
    display: flex; flex-direction: column; 
    align-items: center; justify-content: center; 
    background: var(--bg);
  }
  
  /* Animated Background Canvas */
  #bgCanvas {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(circle at center, #0a0a12 0%, #000 100%);
  }
  
  /* Start Overlay */
  .start-overlay { 
    position: absolute; inset: 0; z-index: 100; 
    background: rgba(0,0,0,0.8); 
    display: flex; flex-direction: column; 
    align-items: center; justify-content: center; 
    gap: 2rem; text-align: center; 
    cursor: pointer; 
    transition: opacity 0.5s var(--ease); 
  }
  .start-overlay.hidden { opacity: 0; pointer-events: none; }
  .start-logo svg { width: 80px; height: 80px; filter: drop-shadow(0 0 10px var(--accent)); }
  .start-text { font-size: 1.5rem; font-weight: 600; color: var(--text-soft); letter-spacing: 0.05em; }
  
  /* Overlays */
  .vignette { 
    position: absolute; inset: 0; z-index: 2; 
    background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.9) 100%); 
    pointer-events: none; 
  }
  
  .kiosk-header { 
    position: absolute; top: 2rem; left: 2rem; z-index: 3; 
    display: flex; align-items: center; gap: 0.75rem; 
    opacity: 0.6; transition: opacity 0.3s ease; 
  }
  .kiosk-header svg { width: 32px; height: 32px; }
  .kiosk-brand { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.02em; }
  
  /* Audio Indicator */
  .audio-indicator { 
    position: absolute; top: 2rem; right: 2rem; z-index: 3; 
    display: flex; align-items: center; gap: 0.5rem; 
    color: var(--text-soft); font-size: 0.8rem; 
    opacity: 0; transition: opacity 0.5s ease; 
  }
  .audio-indicator.show { opacity: 0.6; }
  .audio-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 5px var(--accent); animation: pulse 2s infinite; }
  
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
  
  .exit-hint { 
    position: absolute; bottom: 1.5rem; right: 1.5rem; z-index: 3; 
    font-size: 0.8rem; color: rgba(255,255,255,0.4); 
    background: rgba(0,0,0,0.5); padding: 0.5rem 1rem; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer; 
    transition: all 0.2s ease;
    opacity: 0; 
  }
  .exit-hint.show { opacity: 1; }
  .exit-hint:hover { background: rgba(255,255,255,0.1); color: #fff; }
</style>
</head>
<body>

<div id="kiosk-container">
  <canvas id="bgCanvas"></canvas>
  
  <!-- Start Overlay -->
  <div class="start-overlay" id="startOverlay">
    <div class="start-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
        <rect width="120" height="120" rx="28" fill="#15171c"/>
        <path d="M38 42 L60 24" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
        <path d="M82 42 L60 24" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
        <rect x="32" y="38" width="56" height="64" rx="10" fill="#fff"/>
        <rect x="54" y="51" width="12" height="22" rx="2" fill="none" stroke="#62666d" stroke-width="2.5"/>
        <rect x="58.5" y="55" width="3" height="14" fill="#3b82f6"/>
        <rect x="48" y="94" width="24" height="5" rx="2.5" fill="#3b82f6"/>
        <circle cx="60" cy="20" r="7" fill="#3b82f6"/>
      </svg>
    </div>
    <div class="start-text">Click to Enter Ambient Mode</div>
  </div>

  <!-- Vignette -->
  <div class="vignette"></div>
  
  <!-- UI Overlays -->
  <div class="kiosk-header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <path d="M38 42 L60 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M82 42 L60 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <rect x="32" y="38" width="56" height="64" rx="10" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="60" cy="20" r="7" fill="#fff"/>
    </svg>
    <div class="kiosk-brand">CineLoom Suite</div>
  </div>
  
  <div class="audio-indicator" id="audioIndicator">
    <div class="audio-dot"></div>
    <span>Ambient Audio</span>
  </div>
  
  <button class="exit-hint" id="exitHint">Press ESC or Click to Exit</button>
</div>

<script>
console.log("CineLoom Kiosk v1.2.0 loaded");

const startOverlay = document.getElementById('startOverlay');
const audioIndicator = document.getElementById('audioIndicator');
const exitHint = document.getElementById('exitHint');
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

// --- Animated Background Logic ---
let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticles();
}

function initParticles() {
    particles = [];
    const numParticles = Math.floor((canvas.width * canvas.height) / 12000); // Slightly denser
    for (let i = 0; i < numParticles; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            size: Math.random() * 1.5 + 0.5
        });
    }
}

function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw connections
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) { // Slightly wider connection lines
                ctx.strokeStyle = `rgba(59, 130, 246, ${(1 - dist / 140) * 0.8})`;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    }
    
    // Draw particles
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.fillStyle = 'rgba(139, 92, 246, 0.9)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        
        p.x += p.vx;
        p.y += p.vy;
        
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    }
    
    requestAnimationFrame(drawParticles);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
drawParticles();

// --- Ambient Audio Logic ---
let audioContext, droneNodes = {};

function startAmbientAudio() {
  if (audioContext) return;
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const masterGain = audioContext.createGain();
    masterGain.gain.value = 0.05; 
    masterGain.connect(audioContext.destination);
    
    const freqs = [110, 164.81, 220]; // A minor chord drone
    droneNodes = {};
    
    freqs.forEach((freq, i) => {
      const osc = audioContext.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const gain = audioContext.createGain();
      gain.gain.value = 0.5;
      const lfo = audioContext.createOscillator();
      lfo.frequency.value = 0.05 + (i * 0.02);
      const lfoGain = audioContext.createGain();
      lfoGain.gain.value = 0.2;
      lfo.connect(lfoGain);
      lfoGain.connect(gain.gain);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start();
      lfo.start();
      droneNodes[`osc${i}`] = osc;
      droneNodes[`lfo${i}`] = lfo;
    });
    audioIndicator.classList.add('show');
  } catch (e) {
    console.warn('AudioContext not supported or blocked.', e);
  }
}

// --- Start / Exit Logic ---
startOverlay.addEventListener('click', () => {
  startOverlay.classList.add('hidden');
  startAmbientAudio();
  exitHint.classList.add('show');
});

// Bulletproof Escape Key listener
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.code === 'Escape' || e.keyCode === 27) {
    e.preventDefault();
    window.location.href = 'index.html';
  }
});

exitHint.addEventListener('click', () => {
  window.location.href = 'index.html';
});

// Show cursor on mouse move
document.addEventListener('mousemove', () => {
  document.body.style.cursor = 'auto';
  clearTimeout(window.cursorTimeout);
  window.cursorTimeout = setTimeout(() => {
    document.body.style.cursor = 'none';
  }, 2000);
});
</script>
</body>
</html>
