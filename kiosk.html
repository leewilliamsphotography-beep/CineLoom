<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineLoom Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --text: #ffffff;
    --text-soft: rgba(255, 255, 255, 0.7);
    --accent: #3b82f6;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body { 
    height: 100%; width: 100%; 
    background: var(--bg); color: var(--text); 
    font-family: 'Inter', sans-serif; 
    overflow: hidden; 
    cursor: none; /* Hide cursor for true kiosk feel */
  }
  
  #kiosk-container {
    position: fixed; inset: 0; 
    display: flex; flex-direction: column; 
    align-items: center; justify-content: center; 
    background: var(--bg);
  }
  
  /* Start Overlay */
  .start-overlay { 
    position: absolute; inset: 0; z-index: 100; 
    background: rgba(0,0,0,0.9); 
    display: flex; flex-direction: column; 
    align-items: center; justify-content: center; 
    gap: 2rem; text-align: center; 
    cursor: pointer; 
    transition: opacity 0.5s var(--ease); 
  }
  .start-overlay.hidden { opacity: 0; pointer-events: none; }
  .start-logo svg { width: 80px; height: 80px; }
  .start-text { font-size: 1.5rem; font-weight: 600; color: var(--text-soft); letter-spacing: 0.05em; }
  
  /* Slideshow */
  .poster-stage { 
    position: absolute; inset: 0; 
    overflow: hidden; 
    background: #111; 
  }
  .poster-img { 
    position: absolute; inset: 0; 
    width: 100%; height: 100%; 
    object-fit: cover; object-position: center;
    opacity: 0; 
    transition: opacity 2s ease-in-out; 
  }
  .poster-img.active { opacity: 1; animation: kenburns 20s ease-out forwards; }
  
  @keyframes kenburns {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.15) translate(-2%, -2%); }
  }
  
  /* Overlays */
  .vignette { 
    position: absolute; inset: 0; z-index: 2; 
    background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%); 
    pointer-events: none; 
  }
  
  .kiosk-header { 
    position: absolute; top: 2rem; left: 2rem; z-index: 3; 
    display: flex; align-items: center; gap: 0.75rem; 
    opacity: 0.6; transition: opacity 0.3s ease; 
  }
  .kiosk-header svg { width: 32px; height: 32px; }
  .kiosk-brand { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.02em; }
  
  .movie-info { 
    position: absolute; bottom: 4rem; left: 0; right: 0; z-index: 3; 
    text-align: center; 
    opacity: 0; transition: opacity 1s ease; 
  }
  .movie-info.show { opacity: 1; }
  .movie-title { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.02em; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
  .movie-meta { font-size: 1.1rem; color: var(--text-soft); margin-top: 0.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
  
  .exit-hint { 
    position: absolute; bottom: 1rem; right: 1rem; z-index: 3; 
    font-size: 0.75rem; color: rgba(255,255,255,0.3); 
  }
  
  /* Audio Indicator */
  .audio-indicator { 
    position: absolute; top: 2rem; right: 2rem; z-index: 3; 
    display: flex; align-items: center; gap: 0.5rem; 
    color: var(--text-soft); font-size: 0.8rem; 
    opacity: 0.6; 
  }
  .audio-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 5px var(--accent); }
</style>
</head>
<body>

<div id="kiosk-container">
  <!-- Start Overlay -->
  <div class="start-overlay" id="startOverlay">
    <div class="start-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
        <rect width="120" height="120" rx="28" fill="#15171c"/>
        <path d="M38 42 L60 24" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
        <path d="M82 42 L60 24" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
        <rect x="32" y="38" width="56" height="64" rx="10" fill="#fff"/>
        <rect x="54" y="51" width="12" height="22" rx="2" fill="none" stroke="#62666d" stroke-width="2.5"/>
        <rect x="58.5" y="55" width="3" height="14" fill="#3b82f6"/>
        <rect x="48" y="94" width="24" height="5" rx="2.5" fill="#3b82f6"/>
        <circle cx="60" cy="20" r="7" fill="#3b82f6"/>
      </svg>
    </div>
    <div class="start-text">Click to Enter Ambient Mode</div>
  </div>

  <!-- Slideshow Stage -->
  <div class="poster-stage" id="posterStage"></div>
  
  <!-- Vignette -->
  <div class="vignette"></div>
  
  <!-- UI Overlays -->
  <div class="kiosk-header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <path d="M38 42 L60 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M82 42 L60 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <rect x="32" y="38" width="56" height="64" rx="10" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="60" cy="20" r="7" fill="#fff"/>
    </svg>
    <div class="kiosk-brand">CineLoom Suite</div>
  </div>
  
  <div class="audio-indicator" id="audioIndicator" style="display: none;">
    <div class="audio-dot"></div>
    <span>Ambient Audio</span>
  </div>
  
  <div class="movie-info" id="movieInfo">
    <div class="movie-title" id="movieTitle"></div>
    <div class="movie-meta" id="movieMeta"></div>
  </div>
  
  <div class="exit-hint">Press ESC to exit</div>
</div>

<script>
console.log("CineLoom Kiosk v1.0.0 loaded");

const startOverlay = document.getElementById('startOverlay');
const posterStage = document.getElementById('posterStage');
const movieInfo = document.getElementById('movieInfo');
const movieTitle = document.getElementById('movieTitle');
const movieMeta = document.getElementById('movieMeta');
const audioIndicator = document.getElementById('audioIndicator');

// A curated list of visually stunning movies to fetch from OMDb
const movieList = [
  "Inception", "Interstellar", "The Matrix", "Blade Runner 2049", 
  "Dune", "The Godfather", "Pulp Fiction", "Parasite", 
  "Mad Max: Fury Road", "Avatar", "The Dark Knight", "2001: A Space Odyssey",
  "Drive", "Spirited Away", "The Grand Budapest Hotel", "Tron: Legacy"
];

let currentIndex = 0;
let posters = [];
let audioContext, droneNodes = {};

// --- Ambient Audio Logic ---
function startAmbientAudio() {
  if (audioContext) return;
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    
    // Master Gain
    const masterGain = audioContext.createGain();
    masterGain.gain.value = 0.08; // Very low volume
    masterGain.connect(audioContext.destination);
    
    // Low Frequencies for a deep drone (A2, E3, A3)
    const freqs = [110, 164.81, 220];
    droneNodes = {};
    
    freqs.forEach((freq, i) => {
      const osc = audioContext.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      
      const gain = audioContext.createGain();
      gain.gain.value = 0.5;
      
      // Slow LFO for a breathing effect
      const lfo = audioContext.createOscillator();
      lfo.frequency.value = 0.05 + (i * 0.02); // Slightly different speeds
      const lfoGain = audioContext.createGain();
      lfoGain.gain.value = 0.2;
      lfo.connect(lfoGain);
      lfoGain.connect(gain.gain);
      
      osc.connect(gain);
      gain.connect(masterGain);
      
      osc.start();
      lfo.start();
      
      droneNodes[`osc${i}`] = osc;
      droneNodes[`lfo${i}`] = lfo;
    });
    
    audioIndicator.style.display = 'flex';
  } catch (e) {
    console.warn('AudioContext not supported or blocked.', e);
  }
}

// --- OMDb Fetch Logic ---
async function fetchPosters() {
  const apiKey = localStorage.getItem('cl-omdb-key') || '65149319';
  // Shuffle array for randomness on load
  const shuffled = movieList.sort(() => 0.5 - Math.random());
  
  for (const title of shuffled) {
    try {
      const res = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${apiKey}`);
      const data = await res.json();
      if (data.Response === 'True' && data.Poster && data.Poster !== 'N/A') {
        // Preload image
        const img = new Image();
        img.src = data.Poster;
        await new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
        
        posters.push({
          url: data.Poster,
          title: data.Title,
          year: data.Year,
          genre: data.Genre,
          rating: data.imdbRating
        });
      }
    } catch (e) {
      console.error(`Failed to fetch ${title}`, e);
    }
  }
}

// --- Slideshow Logic ---
async function startSlideshow() {
  movieInfo.classList.remove('show');
  document.getElementById('movieTitle').textContent = 'Loading Posters...';
  document.getElementById('movieMeta').textContent = 'Fetching cinematic visuals...';
  movieInfo.classList.add('show');
  
  await fetchPosters();
  
  if (posters.length === 0) {
    document.getElementById('movieTitle').textContent = 'Could not load posters';
    document.getElementById('movieMeta').textContent = 'Check your OMDb API key in settings.';
    return;
  }
  
  movieInfo.classList.remove('show');
  
  // Initial delay
  setTimeout(() => {
    showNextPoster();
    setInterval(showNextPoster, 12000); // 12 seconds per poster
  }, 2000);
}

function showNextPoster() {
  if (posters.length === 0) return;
  
  const data = posters[currentIndex];
  currentIndex = (currentIndex + 1) % posters.length;
  
  // Create new image element
  const img = document.createElement('img');
  img.src = data.url;
  img.className = 'poster-img';
  img.alt = data.title;
  img.crossOrigin = 'anonymous'; 
  
  posterStage.appendChild(img);
  
  // Fade out old info
  movieInfo.classList.remove('show');
  
  // Trigger fade in after a slight delay
  setTimeout(() => {
    img.classList.add('active');
  }, 100);
  
  // Update Info
  setTimeout(() => {
    movieTitle.textContent = data.title;
    movieMeta.textContent = `${data.year} • ${data.genre} • ★ ${data.rating}`;
    movieInfo.classList.add('show');
  }, 2000);
  
  // Clean up old images
  setTimeout(() => {
    const imgs = posterStage.querySelectorAll('.poster-img:not(.active)');
    imgs.forEach(i => i.remove());
  }, 3000);
}

// --- Start / Exit Logic ---
startOverlay.addEventListener('click', () => {
  startOverlay.classList.add('hidden');
  startAmbientAudio();
  startSlideshow();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    window.location.href = 'index.html';
  }
});

document.addEventListener('mousemove', () => {
  // Show cursor if moved
  document.body.style.cursor = 'auto';
  clearTimeout(window.cursorTimeout);
  window.cursorTimeout = setTimeout(() => {
    document.body.style.cursor = 'none';
  }, 2000);
});
</script>
</body>
</html>
